<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知面陪练 · 锚定知乎多元观点的 AI 面试与答辩教练</title>
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 顶部导航栏 -->
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <a href="#/bank" class="brand" aria-label="知面陪练首页">
          <span class="brand-badge">知面</span>
          <span class="brand-title">知面陪练</span>
        </a>

        <!-- 导航：前 5 步收拢成步骤指示器（编号用小圆徽章），弹药库独立成右侧胶囊 -->
        <nav class="nav-tabs" aria-label="主导航">
          <div class="nav-stepper">
            <a href="#/bank" class="nav-link nav-step" data-route="bank" title="选题库 · 挑一道知乎高频真题，或上传你的简历/项目文档"><span class="step-badge">1</span><span class="step-name">选题库</span></a>
            <span class="step-line" aria-hidden="true"></span>
            <a href="#/explain" class="nav-link nav-step" data-route="explain" title="拆逻辑 · 练前预热：3 分钟看懂核心框架与高分回答结构"><span class="step-badge">2</span><span class="step-name">拆逻辑</span></a>
            <span class="step-line" aria-hidden="true"></span>
            <a href="#/coach" class="nav-link nav-step" data-route="coach" title="模拟练 · 开口实战：语音/文字作答，体验真实面试官连环追问"><span class="step-badge">3</span><span class="step-name">模拟练</span></a>
            <span class="step-line" aria-hidden="true"></span>
            <a href="#/defense" class="nav-link nav-step" data-route="defense" title="抗压测 · 专项攻坚：针对你的薄弱点与项目细节生成刁钻追问清单"><span class="step-badge">4</span><span class="step-name">抗压测</span></a>
            <span class="step-line" aria-hidden="true"></span>
            <a href="#/review" class="nav-link nav-step" data-route="review" title="看复盘 · 逐句诊断：对比参考答案，标出卡壳点与逻辑漏洞"><span class="step-badge">5</span><span class="step-name">看复盘</span></a>
          </div>
          <a href="#/ledger" class="nav-link nav-pill" data-route="ledger" title="弹药库 · 沉淀已掌握的高分话术、薄弱点与场次台账（独立功能区）">
            <span class="nav-pill-label">弹药库</span>
            <span id="nav-review-badge" class="badge-count is-empty">0</span>
          </a>
        </nav>

        <div class="topbar-actions">
          <span id="auth-area"></span>
          <span id="system-status-pill" class="status-pill status-online" title="本地题库与规则引擎已可用，正在后台连接知乎语料">● 本地已就绪</span>
          <button id="btn-export-data" class="btn btn-ghost btn-sm" type="button" title="导出本地 IndexedDB 全量备份">导出数据</button>
          <button id="btn-reset-data" class="btn btn-ghost btn-sm" type="button" title="清空本机 IndexedDB（排查本地库升级阻塞时使用）">重置</button>
          <label class="btn btn-ghost btn-sm" title="导入 JSON 备份">
            导入
            <input id="input-import-data" type="file" accept="application/json" hidden />
          </label>
        </div>
      </div>
    </header>

    <!-- 全局降级/异常横幅（显式提示，绝不静默失败） -->
    <div id="degraded-banner" class="degraded-banner" role="status" aria-live="polite" hidden>
      <span class="degraded-icon">⚠</span>
      <span id="degraded-text">当前处于本地离线兜底模式</span>
      <button id="btn-dismiss-banner" class="btn-icon" type="button" aria-label="关闭提示">✕</button>
    </div>

    <!-- 主视图挂载区 -->
    <main id="screen-root" class="main-container" role="main" tabindex="-1">
      <div class="skeleton-loader">
        <div class="skeleton-bar w-60"></div>
        <div class="skeleton-bar w-90"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>

    <!-- 底部说明：参赛信息收进"关于项目"，不占首屏注意力 -->
    <footer class="footer">
      <div class="footer-inner" style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span>闭环：读懂 → 说清 → 被追问 → 查清楚</span>
          <span aria-hidden="true">·</span>
          <span>隐私承诺：所有录音、转写稿、答题记录与上传文档仅存本地浏览器 IndexedDB，服务端零落盘</span>
        </div>
        <details class="footer-about">
          <summary>关于项目</summary>
          <div style="margin-top:6px;color:var(--text-muted);line-height:1.7;">
            知面陪练 · 知乎黑客松 S3「AI × 陪伴与交互」赛道参赛作品。<br/>
            题库与观点卡来自知乎真实技术与行业问答；诊断规则 10 条、追问与评分均由本机调用模型完成，服务端不落盘任何个人数据。
          </div>
        </details>
      </div>
    </footer>
  </div>

  <!-- Citation 原文片段抽屉 / 弹窗 -->
  <div id="citation-modal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="citation-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="citation-modal-title">引用来源原文对照</h3>
        <button id="btn-close-citation" class="btn-icon" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="citation-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!--
    启动脚本带重试：app.js 会静态 import 6 个界面模块，首屏会一次性并发 7 个模块请求。
    云函数冷启动时实例并发不够，网关会掐断其中几个（浏览器报 ERR_ABORTED / "Failed to
    fetch dynamically imported module"），整个 SPA 就起不来 —— 本地/热实例完全复现不了。
    失败重试第二次就落在已预热的实例上，能稳定起来。
  -->
  <script type="module">
    (async () => {
      for (let attempt = 1; attempt <= 5; attempt++) {
        try {
          await import('./js/app.js');
          return;
        } catch (err) {
          if (attempt === 5) {
            console.error('[知面陪练] 前端模块加载失败：', err);
            document.body.insertAdjacentHTML(
              'beforeend',
              '<div style="padding:16px;color:#b91c1c;font-size:14px">' +
                '页面加载失败，请刷新重试。若持续失败，请用提交表单里的完整链接（含 ?k= 口令）打开。' +
              '</div>'
            );
            return;
          }
          await new Promise((r) => setTimeout(r, 350 * attempt));
        }
      }
    })();
  </script>
</body>
</html>
